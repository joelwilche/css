<!DOCTYPE html>
<html lang="es"> <!-- Lenguaje del documento HTML: español -->
<head>
  <meta charset="UTF-8" /> <!-- Codificación de caracteres -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/> <!-- Escalado y vista en dispositivos móviles -->
  <title>CEC y Asociados</title> <!-- Título de la pestaña del navegador -->
  <link rel="stylesheet" href="styles.css" /> <!-- Enlace al archivo CSS externo -->
  <script defer src="script.js"></script> <!-- Enlace al script JavaScript, cargado después del HTML -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- Iconos de Font Awesome -->
</head>
<body>
  <!-- Encabezado de la página -->
  <header>
    <div class="logo-container"> <!-- Contenedor para el logo y el nombre -->
      <img src="logo.png.jpeg" alt="Logo de CEC y Asociados" class="logo"> <!-- Imagen del logo -->
      <h1>CEC y Asociados</h1> <!-- Título principal -->
    </div>

    <!-- Barra de navegación -->
    <nav>
      <input type="text" id="search" placeholder="Buscar..."> <!-- Barra de búsqueda -->
      <ul> <!-- Lista de enlaces -->
        <li><a href="#arriendo">Arriendo</a></li>
        <li><a href="#venta">Venta</a></li>
        <li><a href="#asesorias">Asesorías</a></li>
        <li><a href="#contacto">Contáctenos</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main>
    <!-- Sección de arriendo -->
    <section id="arriendo">
      <h2>Casas en Arriendo</h2>
      <div class="cards">
        <div class="card">
          <img src="WhatsApp Image 2025-05-28 at 00.05.49.jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.50 (1).jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.50.jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.51 (1).jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.51 (2).jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.51 (3).jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.51 (4).jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.51 (5).jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-28 at 00.05.51.jpeg" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <img src="" alt="Casa en Arriendo"> <!-- Imagen de propiedad -->
          <p>Metraje: 85m²</p> <!-- Metraje -->
          <p>Precio: $350.000.000</p> <!-- Precio -->
        </div>
      </div>
    </section>

    <!-- Sección de venta -->
    <section id="venta">
      <h2>Casas en Venta</h2>
      <div class="cards">
        <div class="card">
          <img src="WhatsApp Image 2025-05-27 at 19.07.14.jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 19.06.16.jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 23.59.47.jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 23.59.47 (1).jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 23.59.47 (2).jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 23.59.47 (3).jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 23.59.47 (4).jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 23.59.47 (5).jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <img src="WhatsApp Image 2025-05-27 at 23.59.48.jpeg" alt="Casa en Venta"> <!-- Imagen de propiedad -->
          <p>Metraje: 65m²</p>
          <p>Precio: $250.000.000</p>
        </div>
      </div>
    </section>

    <!-- Sección de asesorías -->
    <section id="asesorias">
      <h2>Asesorías</h2>
      <label for="asesor">Seleccione un asesor:</label> <!-- Etiqueta -->
      <select id="asesor"> <!-- Menú desplegable -->
        <option value="ana">Ana Martínez</option>
        <option value="carlos">Carlos Gómez</option>
        <option value="laura">Laura Díaz</option>
      </select>
    </section>

    <!-- Sección de contacto -->
    <section id="contacto">
      <h2>Contáctenos</h2>
      <form id="contactoForm"> <!-- Formulario con ID para JS -->
        <input type="text" placeholder="Nombre" required> <!-- Campo de nombre -->
        <input type="email" placeholder="Correo" required> <!-- Campo de correo -->
        <textarea placeholder="Mensaje" required></textarea> <!-- Área de mensaje -->
        <button type="submit">Enviar</button> <!-- Botón para enviar -->
      </form>
    </section>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>Síguenos:</p>
    <!-- Enlaces a redes sociales -->
    <a href="https://web.whatsapp.com/"><i class="fab fa-whatsapp"></i></a>
    <a href="https://github.com/joelwilche/css"><i class="fab fa-github"></i></a>
    <a href="https://web.facebook.com/profile.php?id=100009586845135"><i class="fab fa-facebook"></i></a>
    <p>&copy; 2025 CEC y Asociados</p> <!-- Derechos reservados -->
  </footer>
</body>
</html>
